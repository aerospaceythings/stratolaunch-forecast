name: History window (days 17-30)

on:
  schedule:
    - cron: '30 2 * * *'      # 10:30 AWST, before the daily forecast
  workflow_dispatch:
  push:
    paths: ['forecast/history.py', 'forecast/model.py', '.github/workflows/history.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 180          # Copernicus can queue requests for a while
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-history.txt
      - name: Download ERA5 and fly past years
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python -m forecast.history
      - name: Save to the repo
        id: save
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add -A data/history_window
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "History window $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs || { git checkout --theirs data && git add data && GIT_EDITOR=true git rebase --continue; }
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
      - name: Rebuild the website
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run forecast.yml --ref main
