name: Daily launch forecast

on:
  schedule:
    - cron: '20 5 * * *'      # 13:20 AWST, after the 00Z GFS run is complete
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    paths: ['config.yaml', 'forecast/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run forecast
        run: python -m forecast.run
      - name: Save history to the repo
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
