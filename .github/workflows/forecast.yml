name: Daily launch forecast

on:
  schedule:
    # every GFS run (00/06/12/18Z), ~5 h after it starts, once all 16 days are published:
    # 13:20, 19:20, 01:20 and 07:20 AWST. A run with no new GFS data stops after a minute.
    - cron: '20 5,11,17,23 * * *'
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    paths: ['config.yaml', 'forecast/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always start from the newest saved history, also on re-runs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run forecast
        run: python -m forecast.run ${{ github.event_name == 'schedule' && '--new-cycle-only' || '' }}
      - name: Save history to the repo
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          # if another run saved meanwhile, keep this run's files (-X theirs = the commit being replayed)
          git pull --rebase -X theirs || { git checkout --theirs data && git add data && GIT_EDITOR=true git rebase --continue; }
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
